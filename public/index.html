<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouTube 要約ツール</title>
<meta name="description" content="YouTube の URL を貼るだけで、動画の内容を日本語で要約します。複数の動画をまとめて処理できます。" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f2f4f7;
    --text: #16191d;
    --muted: #616a76;
    --border: #dfe3e8;
    --accent: #c0392b;
    --accent-text: #ffffff;
    --focus: #2f6fd0;
    --danger-bg: #fdeceb;
    --danger-border: #f3c0bb;
    --danger-text: #9b2c20;
    --ok: #2e7d5b;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --panel: #1c2024;
      --panel-2: #23282d;
      --text: #e8eaed;
      --muted: #9aa4b0;
      --border: #333a41;
      --accent: #e0483a;
      --focus: #6aa3ff;
      --danger-bg: #3a1f1c;
      --danger-border: #6b322b;
      --danger-text: #ffb4aa;
      --ok: #5fd1a0;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 800px; margin: 0 auto; padding: 32px 16px 96px; }

  header h1 { font-size: 1.5rem; margin: 0 0 6px; letter-spacing: .01em; }
  header p { margin: 0 0 24px; color: var(--muted); font-size: .9rem; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }

  textarea#urls {
    width: 100%;
    min-height: 84px;
    padding: 12px 14px;
    font-size: .95rem;
    font-family: inherit;
    line-height: 1.7;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    resize: vertical;
  }
  textarea#urls:focus-visible, button:focus-visible, .seg input:focus-visible + span {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-top: 16px; }
  .row > div { flex: 1 1 auto; }

  .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; width: max-content; }
  .seg input { position: absolute; opacity: 0; width: 0; height: 0; }
  .seg span {
    display: block;
    padding: 10px 16px;
    font-size: .875rem;
    cursor: pointer;
    background: var(--panel-2);
    border-right: 1px solid var(--border);
    white-space: nowrap;
  }
  .seg label:last-child span { border-right: none; }
  .seg input:checked + span { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .seg label { margin: 0; position: relative; }

  button.primary {
    padding: 12px 28px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }

  .check {
    display: flex; gap: 8px; align-items: flex-start;
    margin: 16px 0 0; font-size: .85rem; font-weight: 400; cursor: pointer;
  }
  .check input { flex: none; margin: 4px 0 0; accent-color: var(--accent); }
  .check .sub { display: block; margin-top: 2px; font-size: .78rem; color: var(--muted); }

  .hint { margin: 14px 0 0; font-size: .8rem; color: var(--muted); }

  /* --- 全体の進捗 --- */
  #progress {
    display: none;
    margin-top: 24px;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: .9rem;
    color: var(--muted);
  }
  #progress.on { display: flex; gap: 10px; align-items: center; }
  .spinner {
    flex: none; width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

  /* --- 入力エラー / 致命的エラー --- */
  .alert {
    display: none;
    margin-top: 24px;
    padding: 14px 16px;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    border-radius: var(--radius);
    color: var(--danger-text);
    font-size: .9rem;
  }
  .alert.on { display: block; }
  .alert strong { display: block; margin-bottom: 4px; }

  /* --- 動画ごとのカード --- */
  #results { margin-top: 24px; display: flex; flex-direction: column; gap: 20px; }

  .item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .item.err { border-color: var(--danger-border); }

  .item-head { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; }
  .item-head img {
    flex: none; width: 96px; height: 54px; border-radius: 6px; display: block;
    background: var(--panel-2); object-fit: cover;
  }
  .item-head .t { font-weight: 600; font-size: .95rem; line-height: 1.5; word-break: break-word; }
  .item-head .m { font-size: .78rem; color: var(--muted); margin-top: 2px; }
  .item-head .badge {
    display: inline-block; margin-right: 6px; padding: 0 7px;
    font-size: .72rem; font-weight: 700; line-height: 1.7;
    border-radius: 4px; background: var(--panel-2); color: var(--muted);
  }
  .item.done .badge { color: var(--ok); }
  .item.err .badge { color: var(--danger-text); }

  .item-body { padding: 0 20px 16px; }
  .item-body:empty { display: none; }

  .summary h2 { font-size: 1.05rem; margin: 22px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .summary h3 { font-size: .95rem; margin: 18px 0 6px; }
  .summary ul { margin: 8px 0; padding-left: 1.3em; }
  .summary li { margin: 4px 0; }
  .summary p { margin: 8px 0; }
  .summary a.ts {
    display: inline-block; font-variant-numeric: tabular-nums; font-size: .82em;
    color: var(--focus); text-decoration: none;
    background: var(--panel-2); border-radius: 4px; padding: 0 5px;
  }
  .summary a.ts:hover { text-decoration: underline; }
  .caret {
    display: inline-block; width: 8px; height: 1em; background: var(--muted);
    vertical-align: -2px; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .item-err {
    margin: 0 16px 16px;
    padding: 12px 14px;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    border-radius: 8px;
    color: var(--danger-text);
    font-size: .86rem;
  }
  .item-err strong { display: block; margin-bottom: 4px; }
  .item-err details { margin-top: 10px; }
  .item-err summary { cursor: pointer; font-size: .82rem; opacity: .85; }
  .item-err pre {
    margin: 8px 0 0; padding: 10px; overflow-x: auto;
    font-size: .75rem; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
    background: rgba(0, 0, 0, .18); border-radius: 6px;
  }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
  .actions button {
    padding: 7px 14px; font-size: .82rem; font-family: inherit;
    color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
  }
  .note { margin: 0 16px 14px; font-size: .78rem; color: var(--muted); }
  .note:empty { display: none; }

  #bulk { display: none; margin-top: 20px; }
  #bulk.on { display: flex; gap: 8px; }
  #bulk button {
    padding: 9px 16px; font-size: .85rem; font-family: inherit;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  }

  footer { margin-top: 40px; font-size: .78rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>YouTube 要約ツール</h1>
    <p>動画の URL を貼り付けると、内容を日本語で要約します。複数まとめて処理できます。</p>
  </header>

  <form class="card" id="form">
    <label for="urls">YouTube の URL<span id="url-count"></span></label>
    <textarea id="urls" name="urls" rows="3" spellcheck="false" autocomplete="off"
      placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/...&#10;（1行に1つ貼り付けてください）"></textarea>

    <div class="row" id="engine-row" hidden>
      <div>
        <label for="eng-gemini">解析方法</label>
        <div class="seg" role="radiogroup" aria-label="解析方法">
          <label><input type="radio" name="engine" value="gemini" id="eng-gemini" checked><span>動画を解析</span></label>
          <label><input type="radio" name="engine" value="workers-ai" id="eng-workers"><span>字幕から要約</span></label>
        </div>
      </div>
    </div>
    <p class="hint" id="engine-hint"></p>

    <div class="row">
      <div>
        <label for="len-standard">要約の長さ</label>
        <div class="seg" role="radiogroup" aria-label="要約の長さ">
          <label><input type="radio" name="length" value="short" id="len-short"><span>短め</span></label>
          <label><input type="radio" name="length" value="standard" id="len-standard" checked><span>標準</span></label>
          <label><input type="radio" name="length" value="detailed" id="len-detailed"><span>詳しく</span></label>
        </div>
      </div>
      <div style="flex:0 0 auto">
        <button type="submit" class="primary" id="go">要約する</button>
      </div>
    </div>

    <label class="check" for="review">
      <input type="checkbox" id="review" checked />
      <span>
        内容を検証して補正する
        <span class="sub">
          下書きを元の動画と突き合わせ、聞き取り誤りの表記や抜けを直します。
          根拠のない情報は追加しません。時間が約2倍かかります。
        </span>
      </span>
    </label>

    <p class="hint">
      複数指定した場合は1本ずつ順に処理します。長い動画・本数が多いほど時間がかかります。
    </p>
  </form>

  <div id="progress" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="progress-text"></span></div>

  <div id="alert" class="alert" role="alert"></div>

  <div id="results"></div>

  <div id="bulk">
    <button type="button" id="copy-all">すべての要約をコピー</button>
  </div>

  <footer>要約は AI が生成したものです。重要な判断に使う場合は、必ず元の動画をご確認ください。</footer>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const form = $('form'), urlsInput = $('urls'), go = $('go');
const progressBox = $('progress'), progressText = $('progress-text');
const alertBox = $('alert'), resultsBox = $('results'), bulkBox = $('bulk');

/** index → { videoId, title, markdown, el, bodyEl } */
let items = new Map();
let inFlight = null;

const escapeHtml = (s) =>
  s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** [m:ss] / [h:mm:ss] を YouTube の該当時刻へのリンクにする */
function linkTimestamps(html, videoId) {
  if (!videoId) return html;
  return html.replace(/\[(\d{1,2}:)?(\d{1,2}):(\d{2})\]/g, (whole, h, m, s) => {
    const hours = h ? parseInt(h, 10) : 0;
    const total = hours * 3600 + parseInt(m, 10) * 60 + parseInt(s, 10);
    return `<a class="ts" href="https://www.youtube.com/watch?v=${videoId}&t=${total}s" target="_blank" rel="noopener">${whole.slice(1, -1)}</a>`;
  });
}

const inline = (s) =>
  s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(?<!\*)\*(?!\s)(.+?)(?<!\s)\*/g, '<em>$1</em>');

/** モデルが返す Markdown を、必要な範囲だけ HTML にする */
function renderMarkdown(md, videoId) {
  const lines = escapeHtml(md).split('\n');
  const out = [];
  let inList = false;
  const closeList = () => { if (inList) { out.push('</ul>'); inList = false; } };

  for (const line of lines) {
    const t = line.trim();
    if (!t) { closeList(); continue; }

    let m;
    if ((m = t.match(/^###\s+(.*)$/))) { closeList(); out.push(`<h3>${inline(m[1])}</h3>`); }
    else if ((m = t.match(/^#{1,2}\s+(.*)$/))) { closeList(); out.push(`<h2>${inline(m[1])}</h2>`); }
    else if ((m = t.match(/^(?:[-*・]|\d+\.)\s+(.*)$/))) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(`<li>${inline(m[1])}</li>`);
    }
    else { closeList(); out.push(`<p>${inline(t)}</p>`); }
  }
  closeList();
  return linkTimestamps(out.join(''), videoId);
}

const ERROR_HINTS = {
  NO_CAPTIONS: '字幕が公開されていない動画は要約できません。',
  LIVE_STREAM: '',
  NOT_PLAYABLE: '削除された動画、非公開の動画、またはアカウントが削除された動画です。',
  BOT_CHECK: 'サーバーのIPアドレスが一時的に制限されています。数分〜数時間で解除されることが多いので、時間をおいてお試しください。動画の内容とは関係のないエラーです。',
  CLIENT_OUTDATED: 'YouTube 側の仕様変更により、取得方法が古くなった可能性があります。下の詳細を開発者に伝えると修正できます。',
  FETCH_BLOCKED: '時間をおいて再度お試しください。繰り返し起きる場合は、YouTube 側でアクセスが制限されている可能性があります。',
  GEMINI_KEY_INVALID: 'Cloudflare の設定で GEMINI_API_KEY を確認してください。',
  GEMINI_QUOTA: '無料枠は1日あたり動画8時間までです。翌日まで待つか、「字幕から要約」に切り替えてお試しください。',
  GEMINI_FORBIDDEN: 'API キーの権限をご確認ください。',
  GEMINI_TOO_LONG: '動画が長すぎて処理できませんでした。「字幕から要約」に切り替えるとうまくいくことがあります。',
  GEMINI_EMPTY: '限定公開・非公開の動画は Gemini では扱えません。公開動画をお試しください。',
  GEMINI_ERROR: '「字幕から要約」に切り替えるとうまくいくことがあります。',
};

function formatDuration(sec) {
  if (!sec) return '';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? `${h}時間${m}分` : `${m}分${s}秒`;
}

function setProgress(text) {
  progressText.textContent = text;
  progressBox.classList.add('on');
}
const clearProgress = () => progressBox.classList.remove('on');

function showAlert(message, extra) {
  alertBox.innerHTML = `<strong>${escapeHtml(message)}</strong>${extra ? escapeHtml(extra) : ''}`;
  alertBox.classList.add('on');
}

/** 動画1本分のカードを作る */
function createItem(index, videoId, input) {
  const el = document.createElement('article');
  el.className = 'item';
  el.innerHTML = `
    <div class="item-head">
      <img alt="" width="96" height="54" src="https://i.ytimg.com/vi/${encodeURIComponent(videoId)}/mqdefault.jpg" />
      <div>
        <div class="t"></div>
        <div class="m"><span class="badge">待機中</span><span class="meta-text"></span></div>
      </div>
    </div>
    <div class="item-body"></div>
    <p class="note"></p>`;

  el.querySelector('.t').textContent = input;
  resultsBox.appendChild(el);

  const item = {
    videoId, el,
    titleEl: el.querySelector('.t'),
    badgeEl: el.querySelector('.badge'),
    metaEl: el.querySelector('.meta-text'),
    bodyEl: el.querySelector('.item-body'),
    noteEl: el.querySelector('.note'),
    markdown: '',
    title: input,
  };
  items.set(index, item);
  return item;
}

/** カードに操作ボタンを付ける */
function addActions(item) {
  if (item.el.querySelector('.actions')) return;
  const bar = document.createElement('div');
  bar.className = 'actions';

  const copy = document.createElement('button');
  copy.type = 'button';
  copy.textContent = '要約をコピー';
  copy.addEventListener('click', async () => {
    const label = copy.textContent;
    try {
      await navigator.clipboard.writeText(item.markdown);
      copy.textContent = 'コピーしました';
    } catch {
      copy.textContent = 'コピーできませんでした';
    }
    setTimeout(() => (copy.textContent = label), 1500);
  });

  const open = document.createElement('button');
  open.type = 'button';
  open.textContent = 'YouTube で開く';
  open.addEventListener('click', () =>
    window.open(`https://www.youtube.com/watch?v=${item.videoId}`, '_blank', 'noopener'));

  bar.append(copy, open);
  item.noteEl.before(bar);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (inFlight) inFlight.abort();

  const urls = urlsInput.value.split('\n').map((s) => s.trim()).filter(Boolean);
  if (!urls.length) return;

  const length = form.querySelector('input[name="length"]:checked').value;

  // 表示をリセット
  alertBox.classList.remove('on');
  bulkBox.classList.remove('on');
  resultsBox.innerHTML = '';
  items = new Map();
  go.disabled = true;
  setProgress('準備中…');

  const controller = new AbortController();
  inFlight = controller;
  submittedEngine = selectedEngine() ?? engines[0];

  try {
    const res = await fetch('/api/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls, length, review: $('review').checked, engine: requestedEngine() }),
      signal: controller.signal,
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error ?? `サーバーエラー (HTTP ${res.status})`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let sep;
      while ((sep = buffer.indexOf('\n\n')) !== -1) {
        handleEvent(buffer.slice(0, sep));
        buffer = buffer.slice(sep + 2);
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      clearProgress();
      showAlert(err.message ?? '通信に失敗しました');
    }
  } finally {
    go.disabled = false;
    inFlight = null;
    clearProgress();
  }
});

function handleEvent(block) {
  let event = 'message';
  let dataLine = '';
  for (const line of block.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) dataLine += line.slice(5).trim();
  }
  if (!dataLine) return;

  let data;
  try { data = JSON.parse(dataLine); } catch { return; }

  const item = typeof data.index === 'number' ? items.get(data.index) : null;

  if (event === 'queue') {
    for (const q of data.items) createItem(q.index, q.videoId, q.input);

    const notes = [];
    if (data.invalid?.length) {
      notes.push(`URL として認識できなかった行が ${data.invalid.length} 件あります: ${data.invalid.join(' / ')}`);
    }
    if (data.truncated) notes.push(`一度に処理できるのは ${data.limit} 本までです。先頭から ${data.limit} 本を処理します。`);
    if (notes.length) showAlert('一部の入力は処理されません', '\n' + notes.join('\n'));

    setProgress(`${data.items.length} 本を順に処理します…`);
  }

  else if (event === 'status') {
    if (item) {
      item.badgeEl.textContent = '処理中';
      // Gemini が使えず字幕ベースに切り替えた場合は、カードにも残す
      if (data.phase === 'fallback') item.noteEl.textContent = data.message ?? '';
    }
    setProgress(data.message ?? '処理中…');
  }

  else if (event === 'meta') {
    if (!item) return;
    item.title = data.title;
    item.titleEl.textContent = data.title;
    item.el.querySelector('img').src = `https://i.ytimg.com/vi/${encodeURIComponent(data.videoId)}/mqdefault.jpg`;
    const bits = [data.author, formatDuration(data.lengthSeconds)].filter(Boolean);
    if (data.source === 'gemini') {
      bits.push('音声と画面を解析');
    } else if (data.captionLanguage) {
      bits.push(`字幕: ${data.captionLanguage}${data.captionIsAsr ? '（自動生成）' : ''}`);
    }
    item.metaEl.textContent = bits.join(' ・ ');
  }

  else if (event === 'reset') {
    if (!item) return;
    item.markdown = data.text ?? '';
    item.bodyEl.innerHTML = item.markdown
      ? renderMarkdown(item.markdown, item.videoId)
      : '<p style="color:var(--muted)">検証結果を反映しています…</p>';
  }

  else if (event === 'delta') {
    if (!item) return;
    item.markdown += data.text;
    item.bodyEl.innerHTML = `<div class="summary">${renderMarkdown(item.markdown, item.videoId)}<span class="caret"></span></div>`;
  }

  else if (event === 'item-done') {
    if (!item) return;
    item.el.classList.add('done');
    item.badgeEl.textContent = '完了';
    item.bodyEl.innerHTML = `<div class="summary">${renderMarkdown(item.markdown, item.videoId)}</div>`;
    addActions(item);

    const notes = [];
    if (data.sampled) notes.push('動画が長いため、字幕の一部を抜粋して要約しています。');
    if (data.reviewError) notes.push('検証パスが失敗したため、検証前の内容を表示しています。');
    if (data.model) {
      notes.push(`${data.engine === 'gemini' ? '動画を解析' : '字幕から要約'} / ${data.model}`);
    }
    item.noteEl.textContent = notes.join(' ');
  }

  else if (event === 'item-error') {
    if (!item) return;
    item.el.classList.add('err');
    item.badgeEl.textContent = '失敗';

    let hint = ERROR_HINTS[data.code] ?? '';
    if (['BOT_CHECK', 'CLIENT_OUTDATED', 'FETCH_BLOCKED'].includes(data.code)
        && engines.includes('gemini') && submittedEngine === 'workers-ai') {
      hint += ' 解析方法を「動画を解析」に切り替えると、この制限を受けずに要約できます。';
    }
    let html = `<strong>${escapeHtml(data.message)}</strong>${escapeHtml(hint)}`;
    const attempts = data.detail?.attempts;
    if (Array.isArray(attempts) && attempts.length) {
      const rows = attempts
        .map((a) => `${escapeHtml(a.source ?? '?')}: ${escapeHtml(a.error ?? '')}`)
        .join('\n');
      html += `<details><summary>取得を試みた経路 (${attempts.length}件)</summary><pre>${rows}</pre></details>`;
    }
    const box = document.createElement('div');
    box.className = 'item-err';
    box.innerHTML = html;
    item.bodyEl.after(box);
  }

  else if (event === 'done') {
    clearProgress();
    if (data.failed > 0) {
      showAlert(`${data.total} 本中 ${data.succeeded} 本を要約しました`, `\n${data.failed} 本は失敗しています。各カードの理由をご確認ください。`);
    }
    if (data.succeeded > 1) bulkBox.classList.add('on');
  }

  else if (event === 'fatal') {
    clearProgress();
    showAlert(data.message, `\nここまでに ${data.succeeded} 本の要約が完了しています。`);
  }
}

$('copy-all').addEventListener('click', async () => {
  const btn = $('copy-all');
  const text = [...items.values()]
    .filter((i) => i.markdown)
    .map((i) => `# ${i.title}\nhttps://www.youtube.com/watch?v=${i.videoId}\n\n${i.markdown}`)
    .join('\n\n---\n\n');

  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = 'コピーしました';
  } catch {
    btn.textContent = 'コピーできませんでした';
  }
  setTimeout(() => (btn.textContent = 'すべての要約をコピー'), 1500);
});

// --- 使えるエンジンを調べて選択肢を出す ---
let engines = ['workers-ai'];
let defaultEngine = null;
/** 実行時に画面で選ばれていた解析方法。エラー時の案内の出し分けに使う */
let submittedEngine = null;

const ENGINE_NOTES = {
  gemini: '動画の音声と画面を直接解析します。画面に表示された URL やコードも読み取れ、字幕が無い動画にも対応します。公開動画のみ対応・無料枠は1日あたり動画8時間までです。',
  'workers-ai': '字幕を取得して要約します。字幕（自動生成を含む）が付いた動画のみ対応です。YouTube に一時的にアクセスを制限されることがあり、画面にしか出ていない情報は拾えません。',
};

function selectedEngine() {
  if (engines.length < 2) return null;
  return form.querySelector('input[name="engine"]:checked')?.value ?? null;
}

/**
 * サーバーに送る解析方法。既定のまま変えていなければ送らない。
 * 送るとサーバーは「明示的に選ばれた」と扱い、Gemini が失敗しても
 * 字幕ベースに切り替えなくなるため。
 */
function requestedEngine() {
  const e = selectedEngine();
  return e && e !== defaultEngine ? e : undefined;
}

function updateEngineHint() {
  const e = selectedEngine() ?? engines[0];
  $('engine-hint').textContent = ENGINE_NOTES[e] ?? '';
}

(async () => {
  try {
    const res = await fetch('/api/health');
    if (!res.ok) return;
    const health = await res.json();
    engines = health.engines ?? engines;

    if (engines.length > 1) {
      $('engine-row').hidden = false;
      const pref = health.defaultEngine ?? engines[0];
      defaultEngine = pref;
      const radio = form.querySelector(`input[name="engine"][value="${pref}"]`);
      if (radio) radio.checked = true;
      for (const r of form.querySelectorAll('input[name="engine"]')) {
        r.addEventListener('change', updateEngineHint);
      }
    }
    updateEngineHint();
  } catch {
    /* 取得できなくても既定の動作で使える */
  }
})();

// 入力された URL の本数を表示する
urlsInput.addEventListener('input', () => {
  const n = urlsInput.value.split('\n').filter((s) => s.trim()).length;
  $('url-count').textContent = n > 1 ? `（${n} 件）` : '';
});
</script>
